name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Draft release first — the binary builder uploads assets into an existing
  # release, and immutable releases require a draft to attach assets.
  create-draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: 'true'
          ref: ${{ github.ref }}
      - name: Create draft release from tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Auto-generate notes from merged PRs since the previous tag,
          # grouped by the PR's labels (conventional-commit + labeler make
          # this readable). Falls back to the tag message when no PRs exist.
          PREV=$(git describe --abbrev=0 --tags "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --draft \
              --generate-notes \
              --latest=false \
              --notes-start-tag "$PREV" 2>/dev/null \
              || gh release create "${{ github.ref_name }}" \
                   --title "${{ github.ref_name }}" --draft --notes-from-tag
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --draft --notes-from-tag
          fi

  # Pre-built PIE binaries (Linux x86_64 + aarch64, macOS x86_64 + arm64).
  # Windows uses php/php-windows-builder in the windows job below.
  build-binaries:
    name: ${{ matrix.os }} (${{ matrix.arch }}, PHP ${{ matrix.php-version }})
    needs: [create-draft-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            php-version: '8.3'
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            php-version: '8.4'
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            php-version: '8.5'
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            php-version: '8.3'
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            php-version: '8.4'
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            php-version: '8.5'
          - os: darwin
            arch: x86_64
            runner: macos-15-intel
            php-version: '8.3'
          - os: darwin
            arch: x86_64
            runner: macos-15-intel
            php-version: '8.4'
          - os: darwin
            arch: x86_64
            runner: macos-15-intel
            php-version: '8.5'
          - os: darwin
            arch: arm64
            runner: macos-15
            php-version: '8.3'
          - os: darwin
            arch: arm64
            runner: macos-15
            php-version: '8.4'
          - os: darwin
            arch: arm64
            runner: macos-15
            php-version: '8.5'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf
          sudo rm -f /etc/apt/sources.list.d/ondrej-php* /etc/apt/sources.list.d/*ondrej*
          sudo add-apt-repository --no-update -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y php${{ matrix.php-version }}-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf

      - name: Verify core amalgamation is up to date
        run: ./dev/generate_amalgam.sh verify

      - name: Generate core version header
        run: ./dev/generate_version_header.sh

      - name: Build and attach PIE binary
        id: php-ext-binary-builder
        uses: php/pie-ext-binary-builder@0.0.4
        with:
          build-path: bindings/php
          release-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Windows: PIE requires pre-built DLLs.  php/php-windows-builder expects
  # config.w32 at the repo root, which our bindings/php layout does not
  # satisfy, so drive the dev-pack build directly (same flow as ci-php.yml).
  # PHP 8.3 needs VS2019 (retired from GH runners) — Windows builds 8.4/8.5.
  windows:
    name: Windows x86_64 (PHP ${{ matrix.php-version }})
    needs: [create-draft-release]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.4', '8.5' ]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: none

      - name: Download PHP dev pack and locate MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $phpVer = (php -r "echo PHP_VERSION;")
          $ts = (php -r "echo ZEND_THREAD_SAFE ? '' : 'nts-';")
          $mm = ($phpVer -split '\.')[0..1] -join '.'
          $vsPack = @{'8.0'='vs16';'8.1'='vs16';'8.2'='vs16';'8.3'='vs16';'8.4'='vs17';'8.5'='vs17'}[$mm]
          if (-not $vsPack) { $vsPack = 'vs16' }

          $develName = "php-devel-pack-$phpVer-$($ts)Win32-$vsPack-x64.zip"
          $develUrl = "https://windows.php.net/downloads/releases/$develName"
          echo "Building against PHP $phpVer (ts flag: '$ts', devel pack toolset: $vsPack)"
          try {
            Invoke-WebRequest -Uri $develUrl -OutFile devel.zip -MaximumRedirection 5
          } catch {
            $releases = (Invoke-WebRequest -Uri "https://windows.php.net/downloads/releases/" -UseBasicParsing).Content
            $pattern = "php-devel-pack-$($mm)\.(\d+)-$($ts)Win32-$vsPack-x64\.zip"
            $matches = [regex]::Matches($releases, $pattern) | ForEach-Object { $_.Groups[0].Value }
            if ($matches.Count -gt 0) {
              $latest = $matches | Sort-Object -Descending | Select-Object -First 1
              $fallbackUrl = "https://windows.php.net/downloads/releases/$latest"
              echo "Exact devel pack not found ($phpVer), using: $latest"
              Invoke-WebRequest -Uri $fallbackUrl -OutFile devel.zip -MaximumRedirection 5
            } else {
              throw "No devel pack found for PHP $mm"
            }
          }
          Expand-Archive devel.zip -DestinationPath php-dev

          $phpize = (Get-ChildItem php-dev -Recurse -Filter phpize.bat | Select-Object -First 1).FullName
          if (-not $phpize) { throw "phpize.bat not found in dev pack" }
          $phpDev = Split-Path $phpize
          echo "PHP_DEV=$phpDev" >> $env:GITHUB_ENV

          $phpBin = Split-Path (Get-Command php.exe).Source
          echo "PHP_BIN_DIR=$phpBin" >> $env:GITHUB_ENV

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $vsVer = '17'
          $vsRange = "[$($vsVer).0,$([int]$vsVer + 1).0)"
          $vsPath = & $vswhere -version $vsRange -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath -format value
          if (-not $vsPath) { throw "Visual Studio $vsVer.x with VC tools (x86.x64) not found" }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          echo "VCVARS=$vcvars" >> $env:GITHUB_ENV

      - name: Install bison (required by configure.bat)
        shell: pwsh
        run: |
          $bisonUrl = "https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip"
          Invoke-WebRequest -Uri $bisonUrl -OutFile winflexbison.zip -MaximumRedirection 5
          & 7z x winflexbison.zip -owinflexbison -y | Out-Null
          $found = Get-ChildItem winflexbison -Recurse -Filter bison.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) {
            $found = Get-ChildItem winflexbison -Recurse -Filter win_bison.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $found) { throw "bison.exe / win_bison.exe not found after extracting winflexbison" }
          $toolsDir = $found.DirectoryName
          $bisonPath = Join-Path $toolsDir "bison.exe"
          if (-not (Test-Path $bisonPath)) {
            Copy-Item $found.FullName $bisonPath
          }
          echo $toolsDir >> $env:GITHUB_PATH
          & $bisonPath --version

      - name: Create re2c stub source
        shell: pwsh
        run: |
          @'
          #include <stdio.h>
          int main(int argc, char *argv[]) {
              printf("re2c 3.1\n");
              return 0;
          }
          '@ | Set-Content -Path re2c_stub.c -NoNewline

      - name: Generate core version header
        shell: bash
        run: |
          # The Windows phpize build does not run CMake over the core, so the
          # generated snobol/version.h must be produced explicitly from the
          # single version source in CMakeLists.txt.
          ./dev/generate_version_header.sh

      - name: Build extension (phpize + nmake)
        shell: cmd
        run: |
          @echo on
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          set "PATH=%PHP_DEV%;%PHP_BIN_DIR%;%PATH%"
          where bison
          bison --version
          cl.exe /nologo /Fe:re2c.exe re2c_stub.c /link /SUBSYSTEM:CONSOLE
          if errorlevel 1 exit /b 1
          set "PATH=%GITHUB_WORKSPACE%;%PATH%"
          cd /d %GITHUB_WORKSPACE%\bindings\php
          call phpize.bat
          if errorlevel 1 exit /b 1
          call configure.bat --enable-snobol=shared
          if errorlevel 1 exit /b 1
          powershell -Command "$f='x64\Release\resp\SNOBOL_GLOBAL_OBJS.txt'; $c=Get-Content $f -Raw; $c=$c.Replace('\Release\\src/','\Release\\'); $c=$c.Replace('\Release\\src\','\Release\\'); Set-Content $f $c -NoNewline"
          nmake
          if errorlevel 1 exit /b 1
          for /r %%d in (php_snobol.dll) do @if exist "%%d" copy /Y "%%d" .
          dir *.dll
          if not exist php_snobol.dll exit /b 1

      - name: Package DLL per PIE naming convention
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem bindings\php -Recurse -Filter php_snobol.dll | Select-Object -First 1
          if (-not $dll) { throw "php_snobol.dll not found" }
          # PIE's WindowsExtensionAssetName uses the Composer pretty version
          # (v1.0.0, with the 'v') for both the zip and the DLL inside it.
          # The DLL is renamed on install to php_snobol.dll by PIE itself.
          $ver = "${{ github.ref_name }}"
          $base = "php_snobol-$ver-${{ matrix.php-version }}-nts-vs17-x86_64"
          $zipName = "$base.zip"
          Copy-Item $dll.FullName "$base.dll"
          Compress-Archive -Path "$base.dll" -DestinationPath $zipName -Force
          echo "ZIP=$zipName" >> $env:GITHUB_ENV
          echo "Packaged: $zipName ($base.dll inside)"

      - name: Attach Windows binary to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "$env:ZIP"

  # Source tarball (respects .gitattributes export-ignore).
  source-tarball:
    runs-on: ubuntu-latest
    needs: [create-draft-release]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create source tarball
        run: |
          git archive --format=zip --prefix=libsnobol4-${{ github.ref_name }}/ \
            -o libsnobol4-${{ github.ref_name }}-src.zip HEAD

      - name: Attach source tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            libsnobol4-${{ github.ref_name }}-src.zip
