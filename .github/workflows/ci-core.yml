name: CI - Core Library

on:
  push:
    branches: [ main, 'release/**' ]
    paths:
      - 'core/**'
      - 'tests/c/**'
      - 'CMakeLists.txt'
      - 'dev/generate_amalgam.sh'
      - '.github/workflows/ci-core.yml'
      - '.github/workflows/ci-php.yml'
  pull_request:
    branches: [ main, 'release/**' ]
    paths:
      - 'core/**'
      - 'tests/c/**'
      - 'CMakeLists.txt'
      - 'dev/generate_amalgam.sh'
      - '.github/workflows/ci-core.yml'
      - '.github/workflows/ci-php.yml'

jobs:
  core-tests:
    name: Core C Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    env:
      SNOBOL_TEST_TIMEOUT_SECS: "60"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Configure CMake
        run: cmake -B build -DBUILD_TESTS=ON -DBUILD_PHP=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests
        if: matrix.os != 'windows-latest'
        working-directory: build
        run: ctest --output-on-failure

      - name: Run Tests (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: build
        run: ctest --output-on-failure -C Release --verbose

      - name: Capture test binary output (Windows, always)
        if: always() && matrix.os == 'windows-latest'
        working-directory: build
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Recurse -Filter snobol4_tests.exe | Select-Object -First 1
          if ($bin) {
            & $bin.FullName 2>&1 | Tee-Object -FilePath test-direct-output.txt
          } else {
            "snobol4_tests.exe not found" | Out-File test-direct-output.txt
          }

  asan:
    name: AddressSanitizer + UBSan (PR gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang

      - name: Configure CMake with ASan
        run: |
          cmake -B build \
            -DBUILD_TESTS=ON \
            -DBUILD_PHP=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DSNOBOL_SANITIZE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests under ASan
        id: asan_run
        continue-on-error: true
        run: |
          set -o pipefail
          cd build
          ctest --output-on-failure 2>&1 | tee ../asan-report.txt

      - name: Upload ASan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-report
          path: asan-report.txt
          retention-days: 30

      - name: Summarise ASan results
        if: always()
        run: |
          echo "## AddressSanitizer + UBSan Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Sanitizers:** ASan (detect_leaks=1) + UBSan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.asan_run.outcome }}" = "success" ]; then
            echo "✅ **No sanitizer errors detected.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Sanitizer errors detected — see uploaded \`asan-report.txt\`." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "ERROR:|WARNING:|SUMMARY:|runtime error:" asan-report.txt | head -30 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  header-cxx:
    name: Public headers compile as C++ (extern "C" gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential g++ clang

      - name: Configure CMake (generates version.h)
        run: cmake -B build -DBUILD_TESTS=OFF -DBUILD_PHP=OFF

      - name: Compile every public header as C++ with g++ and clang++
        run: |
          set -e
          SRC=core/include
          GEN=build/core/include   # holds the generated snobol/version.h
          fail=0
          for h in "$SRC"/snobol/*.h; do
            name=$(basename "$h")
            [ "$name" = "version.h" ] && continue
            for CC in g++ clang++; do
              if ! "$CC" -fsyntax-only -x c++ -std=c++17 -I"$SRC" -I"$GEN" "$h" 2>"cpp-err.txt"; then
                echo "::error::C++ compile of $name failed with $CC"
                cat cpp-err.txt
                fail=1
              fi
            done
          done
          rm -f cpp-err.txt
          exit $fail

      - name: Build library (for C++ link smoke test)
        run: cmake --build build

      - name: Link a trivial C++ TU against the built library
        run: |
          set -e
          cat > cpp_smoke.cpp <<'EOF'
          #include "snobol/snobol.h"
          #include <cstdio>
          int main() {
            int m=0,n=0,p=0;
            snobol_version(&m,&n,&p);
            std::printf("libsnobol4 %s (api 0x%08x)\n",
                        SNOBOL_VERSION_STRING, snobol_get_api_version());
            snobol_pattern_match_literal(nullptr, nullptr, 0);
            return (m==SNOBOL_VERSION_MAJOR && n==SNOBOL_VERSION_MINOR && p==SNOBOL_VERSION_PATCH) ? 0 : 1;
          }
          EOF
          g++ cpp_smoke.cpp -Icore/include -Ibuild/core/include build/core/libsnobol4.a -o cpp_smoke
          ./cpp_smoke
          rm -f cpp_smoke cpp_smoke.cpp

