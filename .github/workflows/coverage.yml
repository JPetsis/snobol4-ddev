name: Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  coverage-c:
    name: C coverage (gcov/lcov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Configure with coverage flags
        run: cmake -B build -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="--coverage -O0"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Capture coverage
        run: |
          lcov --capture --directory build --output-file coverage.info \
               --rc branch_coverage=1 \
               --exclude '/usr/*'
          # Only tests/ actually ran with instrumentation — examples and
          # bench binaries never execute in this job, so patterns for them
          # would match nothing (lcov hard-errors on unused patterns).
          lcov --remove coverage.info --output-file coverage-filtered.info \
               --ignore-errors unused \
               '*/tests/*' '*/examples/*' '*/bench/*'
          lcov --list coverage-filtered.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage-filtered.info
          flags: c-core
          disable_search: true
          fail_ci_if_error: true

  coverage-php:
    name: PHP extension coverage (gcov on C sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf
          sudo rm -f /etc/apt/sources.list.d/ondrej-php* /etc/apt/sources.list.d/*ondrej*
          sudo add-apt-repository --no-update -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y php8.5-dev

      - name: Install Composer dependencies
        working-directory: bindings/php
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer dump-autoload -o

      - name: Generate core version header
        run: ./dev/generate_version_header.sh

      - name: Build PHP extension with coverage instrumentation
        working-directory: bindings/php
        env:
          CFLAGS: --coverage -O0
          LDFLAGS: --coverage
        run: |
          phpize
          ./configure --enable-snobol=shared
          make -j"$(nproc)"
          sudo make install
          echo "extension=snobol.so" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/99-snobol.ini" > /dev/null
          php -m | grep -i '^snobol$'

      - name: Run PHP tests (drives the instrumented extension)
        working-directory: bindings/php
        run: vendor/bin/phpunit tests/php

      - name: Capture C coverage of the extension sources
        run: |
          # The PHP binding's implementation is C (bindings/php/src/*.c),
          # exercised through PHP tests.  gcov captures it; phpunit's clover
          # would only see the stubs, which never execute.
          lcov --capture --directory bindings/php --output-file php-ext.info \
               --rc branch_coverage=1 \
               --exclude '/usr/*'
          lcov --remove php-ext.info --output-file php-ext-filtered.info \
               --ignore-errors unused \
               '*/tests/*' '*/stubs/*' '*/core/*'
          lcov --list php-ext-filtered.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: php-ext-filtered.info
          flags: php-binding
          disable_search: true
          fail_ci_if_error: true
