name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          alert-lookup: true

      - name: Skip GitHub Actions bumps (need manual review)
        # github_actions bumps touch .github/workflows/*.yml; GITHUB_TOKEN
        # cannot merge PRs that modify workflow files (no workflows scope),
        # and CI changes deserve a human review anyway.
        if: steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: |
          echo "github_actions bumps modify CI workflows — merge manually."
          echo "Skipping auto-merge for this PR."

      - name: Enable auto-merge for patch/minor updates
        if: steps.metadata.outputs.package-ecosystem != 'github_actions'
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve the PR
        if: steps.metadata.outputs.package-ecosystem != 'github_actions'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
