name: CI - PHP Binding

on:
  push:
    branches: [ main, 'release/**' ]
    paths:
      - 'bindings/php/**'
      - 'bindings/php/composer.json'
      - 'bindings/php/composer.lock'
      - 'core/**'
      - 'dev/generate_amalgam.sh'
      - '.github/workflows/ci-php.yml'
  pull_request:
    branches: [ main, 'release/**' ]
    paths:
      - 'bindings/php/**'
      - 'bindings/php/composer.json'
      - 'bindings/php/composer.lock'
      - 'core/**'
      - 'dev/generate_amalgam.sh'
      - '.github/workflows/ci-php.yml'

jobs:
  php-tests:
    name: PHP ${{ matrix.php-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        php-version: [ '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json
          tools: composer
          coverage: none

      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Ubuntu noble's default repos do not ship php8.4-dev.
          # shivammathur/setup-php may have already added ppa:ondrej/php
          # with an inline key, which conflicts with add-apt-repository's
          # keyring format.  Remove any pre-existing ondrej source files
          # before adding the PPA cleanly.
          sudo apt-get update
          sudo apt-get install -y cmake build-essential autoconf software-properties-common
          sudo rm -f /etc/apt/sources.list.d/ondrej-php* /etc/apt/sources.list.d/*ondrej*
          sudo add-apt-repository --no-update -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y php${{ matrix.php-version }}-dev php${{ matrix.php-version }}-cli
          which php-config

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake autoconf
          # Handle PHP installation - may already exist from different tap
          if brew list --versions php@${{ matrix.php-version }} >/dev/null 2>&1; then
            echo "PHP ${{ matrix.php-version }} already installed"
            brew link php@${{ matrix.php-version }} --force || true
          else
            brew install php@${{ matrix.php-version }} || brew link php@${{ matrix.php-version }} --force || true
          fi
          which php-config || echo "php-config not found, checking alternatives"
          ls /usr/local/bin/php-config* 2>/dev/null || ls /opt/homebrew/bin/php-config* 2>/dev/null || true

      - name: Install Composer dependencies
        working-directory: bindings/php
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer dump-autoload -o

      - name: Verify core amalgamation is up to date
        run: |
          ./dev/generate_amalgam.sh verify

      - name: Generate core version header
        # The PHP extension build does not run CMake over the core, so the
        # generated snobol/version.h must be produced explicitly from the
        # single version source in CMakeLists.txt.
        run: |
          ./dev/generate_version_header.sh

      - name: Build PHP extension with phpize
        working-directory: bindings/php
        run: |
          phpize
          # Use =shared to explicitly tell phpize to define COMPILE_DL_SNOBOL
          ./configure --enable-snobol=shared
          make clean
          make
          echo "Extension built at: $(find . -name 'snobol.so' -type f)"
          # Verify get_module is exported (required by PHP to load the extension)
          BUILT_SO=$(find . -name 'snobol.so' -not -path './.libs/*' -type f | head -1)
          if [ -z "$BUILT_SO" ]; then
            BUILT_SO=$(find . -name 'snobol.so' -type f | head -1)
          fi
          if [ -n "$BUILT_SO" ]; then
            echo "=== Built extension: $BUILT_SO ==="
            file "$BUILT_SO" || true
            nm "$BUILT_SO" 2>/dev/null | grep -i get_module \
              && echo "OK: get_module symbol found" \
              || echo "WARNING: get_module NOT found in $BUILT_SO"
          else
            echo "WARNING: snobol.so not found after make"
          fi
          sudo make install
          EXT_DIR=$(php -r 'echo ini_get("extension_dir");')
          echo "Extension installed to: $EXT_DIR"
          ls -la "$EXT_DIR" | grep snobol || echo "Extension not found in extension_dir"
          if [ -f "$EXT_DIR/snobol.so" ]; then
            nm "$EXT_DIR/snobol.so" 2>/dev/null | grep -i get_module \
              && echo "OK: get_module in installed extension" \
              || echo "WARNING: get_module NOT in installed $EXT_DIR/snobol.so"
          fi

      - name: Enable extension
        shell: bash
        run: |
          set -euo pipefail

          # setup-php sets PHP_INI_SCAN_DIR; use it when available
          if [ -n "${PHP_INI_SCAN_DIR:-}" ] && [ -d "$PHP_INI_SCAN_DIR" ]; then
            INI_DIR="$PHP_INI_SCAN_DIR"
            echo "Using PHP_INI_SCAN_DIR: $INI_DIR"
          else
            LOADED_INI=$(php -r 'echo php_ini_loaded_file() ?: "";')
            echo "Loaded php.ini: ${LOADED_INI:-<none>}"
            if [ -n "$LOADED_INI" ]; then
              BASE_DIR=$(dirname "$LOADED_INI")
              if [ -d "$BASE_DIR/conf.d" ]; then
                INI_DIR="$BASE_DIR/conf.d"
                echo "Using conf.d: $INI_DIR"
              else
                echo "Appending extension line to $LOADED_INI"
                echo "extension=snobol.so" | sudo tee -a "$LOADED_INI" > /dev/null
                INI_DIR=""
              fi
            else
              echo "Cannot locate php.ini; aborting" >&2; exit 1
            fi
          fi

          if [ -n "${INI_DIR:-}" ]; then
            sudo mkdir -p "$INI_DIR"
            echo "extension=snobol.so" | sudo tee "$INI_DIR/99-snobol.ini" > /dev/null
            echo "Wrote $INI_DIR/99-snobol.ini"
          fi

          echo "=== php --ini ==="
          php --ini | cat
          echo "=== Verify extension loaded ==="
          php -m | grep -i '^snobol$'
          php -r "if (!extension_loaded('snobol')) { fwrite(STDERR, 'Extension not loaded\n'); exit(1); }"

      - name: Run PHP tests
        working-directory: bindings/php
        run: |
          # Print PHP + extension info for diagnostics
          php -r "echo 'PHP: ' . PHP_VERSION . PHP_EOL . 'Arch: ' . php_uname('m') . PHP_EOL;"
          php -r "if (extension_loaded('snobol')) { echo 'snobol extension loaded' . PHP_EOL; } else { echo 'snobol NOT loaded' . PHP_EOL; }"
          # Run each test file individually so that when a bus error kills the
          # process we know exactly which class was running.  Each invocation
          # prints the filename before phpunit starts so it is visible even if
          # the process is hard-killed mid-test.
          FAILED=0
          for f in $(find tests/php -name '*Test.php' | sort); do
            echo ""
            echo "====== Running: $f ======"
            vendor/bin/phpunit "$f" --testdox 2>&1 || {
              EXIT=$?
              echo "--- $f exited with code $EXIT ---"
              if [ $EXIT -eq 138 ]; then
                echo "Exit 138 = SIGBUS (signal 10) on Apple Silicon — bus error in $f"
              fi
              FAILED=$EXIT
            }
          done
          exit $FAILED

  php-windows:
    name: PHP ${{ matrix.php-version }} (Windows)
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP 8.3 requires VS2019 (v16) but windows-2019
          # has been removed from GitHub Actions.  Skip on Windows.
          - php-version: '8.4'
            os: windows-2022
            vs-version: '17'
          - php-version: '8.5'
            os: windows-2022
            vs-version: '17'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        working-directory: bindings/php
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download PHP dev pack and locate MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Dev pack: headers, import lib (dev/php.lib), phpize.bat/configure.bat.
          # It MUST match the exact PHP version + ts/nts + VS toolset + arch of
          # the PHP that setup-php installed, otherwise the built .dll will not
          # load (ABI mismatch).  The "-vsXX" segment in the dev pack name
          # records which VS built that PHP release.  We must BUILD with the
          # same VS toolset (the MSVC CRT must match for DLL loading).
          $phpVer = (php -r "echo PHP_VERSION;")
          $ts = (php -r "echo ZEND_THREAD_SAFE ? '' : 'nts-';")
          $mm = ($phpVer -split '\.')[0..1] -join '.'
          $vsPack = @{'8.0'='vs16';'8.1'='vs16';'8.2'='vs16';'8.3'='vs16';'8.4'='vs17';'8.5'='vs17'}[$mm]
          if (-not $vsPack) { $vsPack = 'vs16' }

          $develName = "php-devel-pack-$phpVer-$($ts)Win32-$vsPack-x64.zip"
          $develUrl = "https://windows.php.net/downloads/releases/$develName"
          echo "Building against PHP $phpVer (ts flag: '$ts', devel pack toolset: $vsPack)"
          echo "Downloading dev pack: $develUrl"
          try {
            Invoke-WebRequest -Uri $develUrl -OutFile devel.zip -MaximumRedirection 5
          } catch {
            # Fallback: query the releases page to find the latest devel pack
            # for this major.minor version (e.g. "8.5").
            $releases = (Invoke-WebRequest -Uri "https://windows.php.net/downloads/releases/" -UseBasicParsing).Content
            $pattern = "php-devel-pack-$($mm)\.(\d+)-$($ts)Win32-$vsPack-x64\.zip"
            $matches = [regex]::Matches($releases, $pattern) | ForEach-Object { $_.Groups[0].Value }
            if ($matches.Count -gt 0) {
              $latest = $matches | Sort-Object -Descending | Select-Object -First 1
              $fallbackUrl = "https://windows.php.net/downloads/releases/$latest"
              echo "⚠️  Exact devel pack not found ($phpVer), using: $latest"
              Invoke-WebRequest -Uri $fallbackUrl -OutFile devel.zip -MaximumRedirection 5
            } else {
              throw "No devel pack found for PHP $mm"
            }
          }
          Expand-Archive devel.zip -DestinationPath php-dev

          # The devel pack extracts into a single top-level folder; locate
          # phpize.bat and export its directory so the build step can use it.
          $phpize = (Get-ChildItem php-dev -Recurse -Filter phpize.bat | Select-Object -First 1).FullName
          if (-not $phpize) { throw "phpize.bat not found in dev pack" }
          $phpDev = Split-Path $phpize
          echo "PHP_DEV=$phpDev" >> $env:GITHUB_ENV

          # Capture the setup-php PHP install dir so 'php' is the correct
          # version when the devel pack's phpize.bat invokes it.
          $phpBin = Split-Path (Get-Command php.exe).Source
          echo "PHP_BIN_DIR=$phpBin" >> $env:GITHUB_ENV
          echo "phpize.bat at: $phpize"
          echo "php.exe at:    $phpBin"

          # Locate the correct Visual Studio build environment with Microsoft's
          # vswhere.  We MUST use the same VS toolset that built the PHP binary
          # (the MSVC CRT must match for the DLL to load).
          # PHP 8.3 binary → vs16 (VS2019), PHP 8.4/8.5 → vs17 (VS2022).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $vsVer = '${{ matrix.vs-version }}'
          $vsRange = "[$($vsVer).0,$([int]$vsVer + 1).0)"
          echo "Looking for Visual Studio $vsVer.x (range: $vsRange)"
          $vsPath = & $vswhere -version $vsRange -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath -format value
          if (-not $vsPath) { throw "Visual Studio $vsVer.x with VC tools (x86.x64) not found" }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          echo "VCVARS=$vcvars" >> $env:GITHUB_ENV
          echo "Visual Studio at: $vsPath"
          echo "vcvars64.bat at:  $vcvars"

      - name: Install bison (required by configure.bat)
        shell: pwsh
        run: |
          # PHP's configure.bat requires bison >= 3.0.  The Chocolatey
          # winflexbison package ships 2.7, so fetch v2.5.25 from GitHub
          # (bundles bison 3.8.2).
          $bisonUrl = "https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip"
          Invoke-WebRequest -Uri $bisonUrl -OutFile winflexbison.zip -MaximumRedirection 5
          # 7z is pre-installed on windows-latest and more reliable than Expand-Archive
          & 7z x winflexbison.zip -owinflexbison -y | Out-Null
          # Dump extracted contents for debugging
          echo "=== Extracted contents ==="
          Get-ChildItem winflexbison -Recurse | Select-Object FullName | Format-Table -AutoSize
          # Search for bison.exe or win_bison.exe
          $found = Get-ChildItem winflexbison -Recurse -Filter bison.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) {
            $found = Get-ChildItem winflexbison -Recurse -Filter win_bison.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $found) { throw "bison.exe / win_bison.exe not found after extracting winflexbison" }
          $toolsDir = $found.DirectoryName
          echo "Found bison at: $($found.FullName)"
          # Create a bison.exe shim if only win_bison.exe exists
          $bisonPath = Join-Path $toolsDir "bison.exe"
          if (-not (Test-Path $bisonPath)) {
            Copy-Item $found.FullName $bisonPath
            echo "Created bison.exe shim from $($found.Name)"
          }
          echo $toolsDir >> $env:GITHUB_PATH
          & $bisonPath --version

      - name: Create re2c stub source
        shell: pwsh
        run: |
          # PHP's configure.bat requires re2c on PATH but never invokes it
          # for extension builds.  Create a minimal stub to satisfy the check.
          @'
          #include <stdio.h>
          int main(int argc, char *argv[]) {
              printf("re2c 3.1\n");
              return 0;
          }
          '@ | Set-Content -Path re2c_stub.c -NoNewline
          Get-Content re2c_stub.c

      - name: Generate core version header
        shell: bash
        run: |
          # The Windows phpize build does not run CMake over the core, so the
          # generated snobol/version.h must be produced explicitly from the
          # single version source in CMakeLists.txt.
          ./dev/generate_version_header.sh

      - name: Build extension (phpize + nmake)
        shell: cmd
        run: |
          @echo on
          REM Enter the Visual Studio x64 developer environment located in the
          REM previous step, then drive the standard dev-pack build directly:
          REM   phpize.bat -> configure.bat -> nmake
          REM No php-sdk starter / task-file indirection is needed; phpize.bat
          REM only runs a cscript and the build just needs the MSVC toolchain
          REM plus php.exe on PATH.
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          set "PATH=%PHP_DEV%;%PHP_BIN_DIR%;%PATH%"
          where bison
          bison --version
          REM PHP's configure.bat requires re2c on PATH.  For extension
          REM builds the generated lexer files are already in the dev pack
          REM and re2c is never actually invoked, so compile a minimal stub.
          cl.exe /nologo /Fe:re2c.exe re2c_stub.c /link /SUBSYSTEM:CONSOLE
          if errorlevel 1 exit /b 1
          re2c.exe --version
          set "PATH=%GITHUB_WORKSPACE%;%PATH%"
          cd /d %GITHUB_WORKSPACE%\bindings\php
          call phpize.bat
          if errorlevel 1 exit /b 1
          call configure.bat --enable-snobol=shared
          if errorlevel 1 exit /b 1
          REM The PHP SDK's Makefile generator lists sources with src/ prefix in the
          REM linker response file, but the compiler places .obj files flat in the
          REM build directory (via /Fo<dir>).  Patch the response file to remove the
          REM src\ prefix so the linker can find the .obj files.
          powershell -Command "$f='x64\Release\resp\SNOBOL_GLOBAL_OBJS.txt'; $c=Get-Content $f -Raw; $c=$c.Replace('\Release\\src/','\Release\\'); $c=$c.Replace('\Release\\src\','\Release\\'); Set-Content $f $c -NoNewline"
          type x64\Release\resp\SNOBOL_GLOBAL_OBJS.txt
          nmake
          if errorlevel 1 exit /b 1
          REM DLL may be in a subdirectory (x64\Release_NTS, Release_NTS, etc.)
          for /r %%d in (php_snobol.dll) do @if exist "%%d" copy /Y "%%d" .
          dir *.dll
          if not exist php_snobol.dll exit /b 1

      - name: Install and enable extension
        shell: cmd
        run: |
          set PATH=%PHP_BIN_DIR%;%PATH%
          cd bindings\php
          REM DLL may be in a subdirectory (x64/Release_NTS, Release_NTS, etc.)
          if not exist php_snobol.dll (
            for /r %%d in (php_snobol.dll) do @if exist "%%d" copy /Y "%%d" .
          )
          set "DLL=%CD%\php_snobol.dll"
          if not exist "%DLL%" (
            echo ERROR: php_snobol.dll was not built
            echo Searching for any DLL output:
            dir /s /b *.dll 2>nul || echo No DLLs found
            exit /b 1
          )
          for /f "usebackq delims=" %%i in (`php -r "echo ini_get('extension_dir');"`) do set "EXT_DIR=%%i"
          echo "PHP extension_dir: %EXT_DIR%"
          copy /Y "%DLL%" "%EXT_DIR%\"

          REM Enable via the php.ini scan dir (setup-php sets PHP_INI_SCAN_DIR).
          if defined PHP_INI_SCAN_DIR (
            if not exist "%PHP_INI_SCAN_DIR%" mkdir "%PHP_INI_SCAN_DIR%"
            echo extension=snobol > "%PHP_INI_SCAN_DIR%\99-snobol.ini"
          ) else (
            php -r "file_put_contents(php_ini_loaded_file(), PHP_EOL . 'extension=snobol', FILE_APPEND);"
          )
          php -m | findstr /i snobol && echo "snobol extension loaded"

      - name: Run PHP tests
        working-directory: bindings/php
        shell: bash
        run: |
          php -r "echo 'PHP: ' . PHP_VERSION . PHP_EOL;"
          php -r "if (extension_loaded('snobol')) { echo 'snobol extension loaded' . PHP_EOL; } else { echo 'snobol NOT loaded' . PHP_EOL; exit(1); }"
          FAILED=0
          for f in $(find tests/php -name '*Test.php' | sort); do
            echo "====== Running: $f ======"
            php vendor/bin/phpunit "$f" --testdox 2>&1 || FAILED=$?
          done
          exit $FAILED
